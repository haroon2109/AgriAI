version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgis/postgis:15-3.3
    container_name: agri_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=agriai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./legacy_archive/database/init_postgis.sql:/docker-entrypoint-initdb.d/init_postgis.sql

  # 2. FastAPI ML Backend (Brain)
  ml_backend:
    build: ./backend_api
    container_name: agri_ml_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend_api:/app
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/agriai

  # 3. Core Node.js API (Heart)
  core_api:
    build: ./backend_node
    container_name: agri_core_api
    restart: always
    depends_on:
      - ml_backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/agriai
      - JWT_SECRET=AgriAI_2026_Secure_Token@Thanjavur_123!@#
      - FASTAPI_URL=http://ml_backend:8000

  # 4. React Frontend (Face)
  frontend:
    build: ./frontend_react
    container_name: agri_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - core_api
    environment:
      - VITE_API_URL=http://localhost:5000/api

volumes:
  postgres_data:
